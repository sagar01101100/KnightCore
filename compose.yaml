# Local evaluation stack. Configure real HTTPS, SMTP and business details before production.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "${SQL_ACCEPT_EULA:?Set SQL_ACCEPT_EULA=Y after reviewing SQL Server terms}"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Set SQL_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      retries: 20
      start_period: 30s
  initialize:
    build: ./backend
    command: ["--initialize"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=sqlserver;Database=KnightCore;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      PublicOrigin: http://localhost:8080
      Email__Provider: Local
      Bootstrap__AdminEmail: "${ADMIN_EMAIL:?Set ADMIN_EMAIL}"
      Bootstrap__AdminPassword: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"
      DataDirectory: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      sqlserver:
        condition: service_healthy
  api:
    build: ./backend
    environment: *api-environment
    volumes:
      - app-data:/app/data
    depends_on:
      initialize:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  sql-data:
  app-data:
