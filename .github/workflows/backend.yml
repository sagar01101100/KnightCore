name: Backend validation
on:
  push:
    paths: ['backend/**', 'tests/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'tests/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/KnightCore.Api --configuration Release
      - run: python3 tests/smoke.py
